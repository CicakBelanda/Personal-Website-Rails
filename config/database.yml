# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV.fetch("DATABASE_URL") { "postgres://localhost/#{Rails.env}" } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  ssl_mode: <%= if ENV.fetch("RAILS_ENV", "development") == "production" then "require" else "prefer" end %>
  timeout: 5000

development:
  <<: *default
  database: personal_website_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: personal_website_test

# Production on Railway: PostgreSQL add-on injects DATABASE_URL.
# Solid Cache / Queue / Cable share the same PostgreSQL database (single DB instance).
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "personal_website_production") %>
  cache:
    <<: *default
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    migrations_paths: db/cable_migrate
