# Railway deployment config for PersonalWebsite (Rails 8.1 + Postgres + Propshaft/Importmap)
# Deploy: Railway dashboard -> New Project -> Deploy from GitHub -> select this repo.
# Then add a PostgreSQL plugin (auto-injects DATABASE_URL) and set the env vars below.

[build]
# nixpacks auto-detects Rails; no custom build command needed.
builder = "nixpacks"

[deploy]
# Runs on every successful build before the service starts.
# db:prepare is idempotent: creates the DB if missing, runs all migrations
# (primary + solid_queue/cache/cable), and loads seeds.rb on first create.
releaseCommand = "bin/rails db:migrate db:seed"
healthcheckPath = "/up"
healthcheckTimeout = 100
restartPolicy = "on_failure"

[env]
RAILS_ENV = "production"
RAILS_SERVE_STATIC_FILES = "1"
RAILS_STORAGE_DIR = "/data/storage"
BUNDLE_WITHOUT = "development:test"
# Set these in the Railway dashboard (do NOT commit real values):
#   DATABASE_URL            -> auto-injected by the PostgreSQL plugin
#   RAILS_MASTER_KEY        -> from config/master.key (cat config/master.key)
#   ADMIN_PASSWORD          -> your admin CMS password

[[services]]
  name = "web"

  [[services.volumes]]
    # Persistent volume for Active Storage uploads (survives restarts).
    name = "storage"
    mount = "/data"
    size = 1
